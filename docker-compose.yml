services:
  app:
    build: .
    image: workout-tracker:local
    ports:
      - "8000:8000"
    environment:
      WORKOUT_DB_PATH: /app/data/workouts.db
      HOST: 0.0.0.0
      PORT: "8000"
    volumes:
      # Persist SQLite across restarts
      - workout-data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  workout-data:
