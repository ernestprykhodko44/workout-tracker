{% macro icon(name, size=20) -%}
<svg width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{% if name == 'grid' %}<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>
{% elif name == 'dumbbell' %}<path d="m6 7 11 11M4 9l5-5m6 16 5-5M2 7l5-5m10 20 5-5M3 6l3 3m9 6 3 3"/>
{% elif name == 'calendar' %}<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4m10-4v4M3 11h18m-13 4h2m4 0h2m-8 3h2"/>
{% elif name == 'history' %}<path d="M3 11a9 9 0 1 1 2.5 7M3 4v7h7m2-4v5l3 2"/>
{% elif name == 'arrow' %}<path d="M4 12h16m-6-6 6 6-6 6"/>
{% elif name == 'chevron' %}<path d="m9 5 7 7-7 7"/>
{% elif name == 'plus' %}<path d="M12 5v14M5 12h14"/>
{% elif name == 'check' %}<path d="m5 12 4 4L19 6"/>
{% elif name == 'activity' %}<path d="M3 12h4l3-8 4 16 3-8h4"/>
{% elif name == 'target' %}<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>
{% elif name == 'leaf' %}<path d="M20 3C8 1 2 9 7 16s15 0 13-13ZM5 21 16 9"/>
{% elif name == 'clock' %}<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
{% elif name == 'close' %}<path d="m6 6 12 12M6 18 18 6"/>
{% elif name == 'note' %}<path d="M14 3H5v18h14V8Zm0 0v5h5M8 12h8m-8 4h5"/>
{% elif name == 'bolt' %}<path d="m13 2-9 12h7l-1 8 10-12h-7Z"/>
{% elif name == 'info' %}<circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v.1"/>
{% endif %}
</svg>
{%- endmacro %}
